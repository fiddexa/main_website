<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Partner | FIDDEXA</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><img src="images/fiddexa-title.png" alt="FIDDEXA"></a><button class="menu-btn">MENU</button><nav class="nav"><a href="index.html">HOME</a><a href="about.html" data-i18n="navAbout">ABOUT</a><a href="offers.html" data-i18n="navAreas">BUSINESS AREAS</a><a href="partner.html" data-i18n="navPartner">PARTNERS</a><div class="lang"><button class="lang-btn"><span data-lang-label>EN</span> +</button><div class="lang-menu"><button data-lang="en">ENGLISH</button><button data-lang="ru">РУССКИЙ</button><button data-lang="zh">中文</button></div></div></nav></div></header>
<main><section class="page-hero"><div class="container"><div class="section-kicker">FIDDEXA</div><h1 data-i18n="partnerPageTitle">BECOME A PARTNER</h1><p data-i18n="partnerPageLead">We welcome companies, distributors, suppliers, buyers and strategic partners.</p></div></section>
<section class="container form-wrap">
<form id="partner-form" class="form-grid" action="https://api.web3forms.com/submit" method="POST">
<input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
<input type="hidden" name="subject" value="FIDDEXA — New Business Inquiry">
<input type="hidden" name="from_name" value="FIDDEXA Website">
<div class="field"><label data-i18n="formType">ENTITY TYPE</label><select name="entity_type" required><option value="">Select</option><option>Individual</option><option>Company</option></select></div>
<div class="field"><label data-i18n="formCountry">COUNTRY</label><input name="country" required></div>
<div class="field full"><label data-i18n="formContact">CONTACT</label><input name="contact" placeholder="Email / Phone / WeChat" required></div>
<div class="field full"><label data-i18n="formMessage">QUESTION OR PROPOSAL</label><textarea name="message" required></textarea></div>
<div class="form-actions"><button class="btn" type="submit" data-i18n="formSend">SEND REQUEST</button><span class="form-note" data-i18n="formNote">Your information is used only to review your business inquiry.</span></div>
<div id="form-status" class="status"></div>
</form></section></main>
<footer class="site-footer"><div class="container"><div class="footer-top"><div class="footer-brand">FIDDEXA</div><a class="footer-mail" href="mailto:contact@fiddexa.com">contact@fiddexa.com</a></div><div class="footer-bottom">© 2026 FIDDEXA — <span data-i18n="footer">CONNECTING BUSINESSES WORLDWIDE</span></div></div></footer>
<script src="script.js"></script>
<script>
document.getElementById("partner-form")?.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const form=e.currentTarget, status=document.getElementById("form-status"), btn=form.querySelector("button[type=submit]");
  if(form.querySelector('input[name="access_key"]').value==="YOUR_WEB3FORMS_ACCESS_KEY"){
    status.textContent="Form setup required: add your Web3Forms access key.";
    status.className="status show"; return;
  }
  btn.disabled=true;
  try{
    const res=await fetch(form.action,{method:"POST",body:new FormData(form),headers:{Accept:"application/json"}});
    const data=await res.json();
    status.textContent=data.success?"Thank you. Your request has been sent.":"Unable to send the request. Please try again or email contact@fiddexa.com.";
    status.className="status show";
    if(data.success) form.reset();
  }catch{
    status.textContent="Unable to send the request. Please email contact@fiddexa.com.";
    status.className="status show";
  }finally{btn.disabled=false;}
});
</script></body></html>
